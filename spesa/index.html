<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e6003a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<title>Spesa & Frigo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<style>
:root{
  --red:#e6003a; --bg:#fff5f7; --card:#fff; --text:#2b2b2b; --muted:#777;
  --ok:#1e9e4a; --ok-bg:#e6f6ec;
  --low:#d99a00; --low-bg:#fff6d9;
  --out:#d62828; --out-bg:#fde8e8;
  --border:#f0d6dc; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
.hidden{display:none !important}

/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#login h1{color:var(--red);margin:0;font-size:32px}
#login p{color:var(--muted);margin:0;max-width:320px}
.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
.btn.secondary{background:#eee;color:#333}
.btn.small{padding:8px 14px;font-size:14px}
.err{color:var(--out);font-weight:600;max-width:340px}

/* HEADER */
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:12px 16px 0;
  padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0}
.top .who{font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px}
.top .who button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:999px;padding:4px 10px;cursor:pointer}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{flex:1;white-space:nowrap;background:transparent;border:none;color:#fff;opacity:.7;padding:10px 4px;font-weight:700;cursor:pointer;
  border-bottom:3px solid transparent}
.tab.active{opacity:1;border-bottom-color:#fff}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:#fff;color:var(--red);font-size:12px;margin-left:4px}

main{max-width:640px;margin:0 auto;padding:16px}
section{display:flex;flex-direction:column;gap:14px}

/* FORM */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.panel h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{min-width:0}
input[type=text],input[type=number],input[type=search]{border:1px solid #ddd;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.grow{flex:1 1 160px}
.qty{flex:0 0 90px}
.unit{flex:0 0 90px}
label.lab{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}

/* LISTE */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-left:6px solid #ccc;
  border-radius:var(--radius);padding:10px 12px}
.item .info{flex:1;min-width:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted)}
.item.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.item.low{border-left-color:var(--low);background:var(--low-bg)}
.item.out{border-left-color:var(--out);background:var(--out-bg)}
.item.done{opacity:.55}
.item.done .name{text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.dot.ok{background:var(--ok)} .dot.low{background:var(--low)} .dot.out{background:var(--out)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.icon{border:none;background:#fff;border:1px solid #ddd;border-radius:10px;min-width:38px;height:38px;cursor:pointer;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.icon.buy{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700;font-size:14px;padding:0 12px}
.count{font-weight:800;font-size:18px;min-width:44px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.chip .dot{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px dashed #bbb;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}

/* DIALOG */
dialog{border:none;border-radius:18px;padding:20px;width:min(380px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px}
dialog .field{margin-bottom:10px}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper input{text-align:center;font-size:20px;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:#fff;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}

.mt{margin-top:12px}
.store-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;margin-left:4px;vertical-align:middle}
.storebox{margin-top:10px;padding:12px;border-radius:12px;background:#faf6f7;border:1px dashed var(--border)}
.sugg button.pick{border-style:solid}
.sugg button.pick.active{background:var(--text);color:#fff;border-color:var(--text)}
.group-h{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;font-weight:800}
.group-h a{font-size:13px;font-weight:600;color:var(--red);text-decoration:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
select{border:1px solid #ddd;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.submit-row{display:flex;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <div style="font-size:64px">🛒🧊</div>
  <h1>Spesa & Frigo</h1>
  <p>Area privata. Entra con il tuo account Google.</p>
  <button class="btn" id="loginBtn">Entra con Google</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <h1>🛒 Spesa & Frigo</h1>
      <div class="who"><span id="whoName"></span><button id="logoutBtn">Esci</button></div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="spesa">🛒 Spesa <span class="badge" id="listBadge">0</span></button>
      <button class="tab" data-tab="frigo">🧊 Frigo</button>
      <button class="tab" data-tab="casa">🏠 Casa</button>
    </nav>
  </header>

  <main>
    <!-- ======== TAB SPESA ======== -->
    <section id="tab-spesa">
      <form class="panel" id="addListForm" autocomplete="off">
        <h2>Aggiungi alla lista della spesa</h2>

        <label class="lab">A) Prodotto e quantità</label>
        <div class="row">
          <input class="grow" type="text" id="listName" placeholder="Es. Latte" list="itemNames" required>
          <input class="qty" type="number" id="listQty" placeholder="Q.tà" min="0" step="any" value="1">
        </div>

        <label class="lab mt">Dove va?</label>
        <div class="chips" id="placeChips">
          <button type="button" class="chip active" data-place="frigo">🧊 Frigo</button>
          <button type="button" class="chip" data-place="casa">🏠 Casa</button>
        </div>

        <label class="lab mt">B) Vuoi scegliere il negozio?</label>
        <div class="chips" id="storeChips"></div>

        <div id="storeBox" class="storebox hidden">
          <label class="lab">C) Prodotti <b id="storeName"></b> già scelti da voi</label>
          <div class="sugg" id="catalogChips"></div>
          <label class="lab mt">…oppure scrivi il prodotto preciso</label>
          <div class="row">
            <input class="grow" type="text" id="listProduct" placeholder="Es. Latte parzialmente scremato 1 L">
            <a class="btn small secondary" id="storeSearch" target="_blank" rel="noopener">🔍 Cerca</a>
          </div>
        </div>

        <div class="submit-row"><button class="btn" type="submit">Aggiungi alla lista</button></div>
      </form>

      <div class="panel" id="suggPanel">
        <h2>Finiti o quasi (tocca per aggiungerli)</h2>
        <div class="sugg" id="suggestions"></div>
      </div>

      <div>
        <h2 style="font-size:16px;margin:4px 0 0">Da comprare</h2>
        <div id="shoppingList"></div>
      </div>
    </section>

    <!-- ======== TAB FRIGO / CASA (stessa vista) ======== -->
    <section id="tab-inv" class="hidden">
      <form class="panel" id="addInvForm" autocomplete="off">
        <h2 id="invTitle">Aggiungi un alimento al frigo</h2>
        <div class="row">
          <div class="grow"><label class="lab">Nome</label><input type="text" id="fName" placeholder="Es. Uova" list="itemNames" required></div>
          <div class="qty"><label class="lab">Quantità</label><input type="number" id="fQty" min="0" step="any" value="1"></div>
        </div>
        <div class="row" style="margin-top:8px;align-items:flex-end">
          <div class="unit"><label class="lab">Unità</label><input type="text" id="fUnit" placeholder="pz, g, l…"></div>
          <div class="qty"><label class="lab">"Pochi" se ≤</label><input type="number" id="fLow" min="0" step="any" value="1"></div>
          <button class="btn" type="submit" style="margin-left:auto">Aggiungi</button>
        </div>
      </form>

      <div class="row" style="align-items:center">
        <input class="grow" type="search" id="search" placeholder="🔍 Cerca…">
      </div>
      <div class="chips" id="filters">
        <button class="chip active" data-f="all">Tutti</button>
        <button class="chip" data-f="ok"><span class="dot ok"></span>Presenti <span id="cOk"></span></button>
        <button class="chip" data-f="low"><span class="dot low"></span>Pochi <span id="cLow"></span></button>
        <button class="chip" data-f="out"><span class="dot out"></span>Finiti <span id="cOut"></span></button>
      </div>

      <div class="list" id="invList"></div>
    </section>
  </main>
</div>

<datalist id="itemNames"></datalist>

<!-- Dialog: quante ne hai comprate -->
<dialog id="buyDialog">
  <form method="dialog" id="buyForm">
    <h3 id="buyTitle">Comprato!</h3>
    <label class="lab">Quante ne hai comprate?</label>
    <div class="stepper">
      <button type="button" class="icon" id="buyMinus">−</button>
      <input type="number" id="buyQty" min="0" step="any">
      <button type="button" class="icon" id="buyPlus">+</button>
    </div>
    <div class="btns">
      <button class="btn secondary" value="cancel" formnovalidate>Annulla</button>
      <button class="btn" value="ok" id="buyOk">Metti via</button>
    </div>
  </form>
</dialog>

<!-- Dialog: modifica -->
<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h3>Modifica</h3>
    <div class="field"><label class="lab">Nome</label><input type="text" id="eName" required></div>
    <div class="row field">
      <div class="qty"><label class="lab">Quantità</label><input type="number" id="eQty" min="0" step="any"></div>
      <div class="unit"><label class="lab">Unità</label><input type="text" id="eUnit"></div>
      <div class="qty"><label class="lab">"Pochi" se ≤</label><input type="number" id="eLow" min="0" step="any"></div>
    </div>
    <div class="row field">
      <div class="grow"><label class="lab">Dove sta</label>
        <select id="ePlace"><option value="frigo">🧊 Frigo</option><option value="casa">🏠 Casa</option></select></div>
      <div class="grow"><label class="lab">Negozio preferito</label><select id="eStore"></select></div>
    </div>
    <div class="field"><label class="lab">Prodotto preciso</label><input type="text" id="eProduct" placeholder="(facoltativo)"></div>
    <div class="btns">
      <button class="btn secondary" value="delete" formnovalidate style="margin-right:auto;background:var(--out-bg);color:var(--out)">Elimina</button>
      <button class="btn secondary" value="cancel" formnovalidate>Annulla</button>
      <button class="btn" value="ok">Salva</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
